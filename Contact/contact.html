<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
    <link rel="stylesheet" href="contact.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/lenspulse-burger-8983946.png"

    <div class="logo">
      <h1>Welcome to Noisy Bur
        ger</h1>
    </div>

    <nav class="navbar">
      <img src="/images/lenspulse-burger-8983946.png" alt="Burger" />
      <ul>
        <li><a href="/Home/home.html">Home</a></li>

      <div>
        <button class="button">Reserve</button>
      </div>

    <aside class="contact-section">
      <h3>Get in touch with us</h3>
      <form class="inputs">
        <input type="text" placeholder="Name" required />
        <input type="text" placeholder="Last Name" required />
        <input type="email" placeholder="Email" required />
        <textarea placeholder="Message" rows="10" required></textarea>

      </form>

    <footer>
      <div class="info">

        <p>Location: 123 Burger Lane, Foodie District</p>

        <br />
